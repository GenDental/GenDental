model:
  module: models.stage_two.stage_two.MotionTransfer
  params:
    task_mode: motion
    transformer_config:
      module: models.stage_two.style_transformer.StyleTransformer
      params:
          z_dim: 512
          num_layers: 12
          num_heads: 8
          input_dim: 3
        

    
    optimizer_config:
      module: torch.optim.AdamW
      weight_decay: 0.05
      betas: [0.9, 0.95]
      eps: 1e-8

    scheduler_config:
      module: pl_bolts.optimizers.lr_scheduler.LinearWarmupCosineAnnealingLR
      params:
        warmup_epochs: 5
        warmup_start_lr: 1e-7
        eta_min: 1e-7
    
    
  
dataset:
  module: dataset.style_transfer.StageTwoDataManager
  params:
    data_path: /data3/leics/dataset/teeth/sample512_merged
    index_path: "files/motion"
    batch_size: 8
    task_mode: ${model.params.task_mode}




