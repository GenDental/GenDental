model:
  module: models.global_encoder.gpt_old.oldGPT
  params:
    transformer_config:
      module: models.global_encoder.gpt_blocks_old.old_transformer
      params:
        trans_dim: 768
        depth: 18
        drop_path_rate: 0.1
        num_heads: 8
        group_size: 512
        encoder_dims: 512
        decoder_depth: 3
        num_groups: 33

        # Keep the old position-specific PointNet++ encoders and RVQ path.
        encoder_config: null
        style_dims: 2048
        codebook_size: 2048
        num_quantizers: 2
        codebook_dim: 1024
        share_encoder: false
        use_vq: true

        dropout: 0.1
        attn_dropout: 0.05
        mlp_ratio: 4.0
        center_scale: 1.0
        position_dropout: 0.0

        # One noise vector is shared by all 32 teeth in a generated arch.
        # The zero-initialized residual keeps initial behavior identical to
        # the deterministic old decoder.
        generation_noise_dim: 64
        generation_noise_scale: 0.03

    optimizer_config:
      module: torch.optim.AdamW
      params:
        weight_decay: 0.05
        betas: [0.9, 0.95]
        eps: 1.0e-8

    scheduler_config:
      module: utils.lr_scheduler.HorizonAwareWarmupCosineLR
      params:
        warmup_epochs: 10
        warmup_start_lr: 0.0
        eta_min: 1.0e-7

    use_ema: true
    # Two candidates limit the extra Chamfer memory while making the noise
    # branch useful through a whole-arch best-of-K reconstruction objective.
    generation_num_candidates: 2
    test_output_dir: ./gpt_samples
    num_test_generations: 1
    max_test_samples: 2000
    save_merged: true
    missing_point_eps: 1.0e-6

dataset:
  module: dataset.teeth_dataset.TeethDataManager
  params:
    data_path: /data3/leics/dataset/teeth/sample512_merged
    index_path: files/zj
    batch_size: 16
    with_normals: false

generation:
  output_dir: ./gpt_samples
  num_samples: 200
  batch_size: 16
  save_merged: true
  seed: 3407
